spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowpay_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  sql:
    init:
      mode: never