spring:
  jackson:
    time-zone: "America/Sao_Paulo"
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flowpay_db}}
    username: ${DB_USER:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  sql:
    init:
      mode: never

flowpay:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:150}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:120}
    refill-duration-seconds: ${RATE_LIMIT_REFILL_DURATION_SECONDS:60}