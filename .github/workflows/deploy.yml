name: 🚀 CI/CD - Build, Push & Deploy na AWS EC2

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Push da Imagem Docker (Faz o trabalho pesado)
  # -------------------------------------------------------------
  build-and-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: 🔑 Login no Container Registry (GHCR no Runner)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extrair Metadados do Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: 🏗️ Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # Job 2: Deploy na AWS EC2 via SSH (Faz o trabalho leve)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy na EC2 via Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push # Só roda se o Job 1 der sucesso

    steps:
      - name: 🔑 Configurar Agente SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 🌐 Adicionar Host ao known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 🔄 Executar Deploy Remoto
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/flowpay-app

            echo "🔑 Autenticando no GHCR na EC2..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "📥 Puxando imagens mais recentes..."
            docker compose pull

            echo "🚀 Reiniciando os containers..."
            docker compose up -d --remove-orphans

            echo "🧹 Limpando imagens antigas..."
            docker image prune -f

            echo "✅ Deploy finalizado com sucesso na EC2!"
          EOF
