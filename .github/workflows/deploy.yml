name: 🚀 CI/CD - Build, Test & Deploy na AWS EC2

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Job 1: Testes Automatizados, Build & Push da Imagem Docker
  # -------------------------------------------------------------
  build-and-push:
    name: 🧪 Test, Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.image-meta.outputs.image_name }}

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: 🧪 Executar Testes Automatizados
        run: |
          chmod +x ./mvnw
          ./mvnw clean test

      - name: 🏷️ Definir Nome da Imagem em Minúsculo
        id: image-meta
        run: |
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${LOWER_REPO}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=ghcr.io/${LOWER_REPO}" >> $GITHUB_ENV

      - name: 🔑 Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build & Push da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # -------------------------------------------------------------
  # Job 2: Deploy Automatizado na AWS EC2 via SSH
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Deploy na EC2 via Docker Compose
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🔑 Configurar Agente SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: 🌐 Adicionar Host ao known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📁 Garantir Diretório e Sincronizar docker-compose.yml
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/flowpay-app"
          scp docker-compose.yml ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/flowpay-app/docker-compose.yml

      - name: 🔄 Executar Deploy Remoto na EC2
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_name }}:latest
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            cd ~/flowpay-app

            echo "🔑 Autenticando no GHCR na EC2..."
            echo "${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "⚙️ Configurando variáveis de ambiente do Compose..."
            if [ -f .env ]; then
              # Atualiza ou adiciona API_IMAGE no .env existente
              grep -v '^API_IMAGE=' .env > .env.tmp || true
              echo "API_IMAGE=${IMAGE_TAG}" >> .env.tmp
              mv .env.tmp .env
            else
              echo "API_IMAGE=${IMAGE_TAG}" > .env
            fi

            export API_IMAGE="${IMAGE_TAG}"

            echo "📥 Puxando as imagens mais recentes (${IMAGE_TAG})..."
            docker compose pull

            echo "🚀 Reiniciando os containers..."
            docker rm -f flowpay-api flowpay-postgres 2>/dev/null || true
            docker compose up -d --remove-orphans

            echo "🧹 Limpando imagens antigas não utilizadas..."
            docker image prune -f

            echo "🩺 Validando disponibilidade da aplicação..."
            for i in {1..12}; do
              if curl -sSf http://localhost:8080/v1/queues/status > /dev/null 2>&1; then
                echo "✅ Aplicação online e respondendo com sucesso!"
                exit 0
              fi
              echo "⏳ Aguardando inicialização da API (\$i/12)..."
              sleep 5
            done

            echo "⚠️ Aviso: Aplicação ainda não respondeu no healthcheck dentro do tempo esperado, verifique os logs com 'docker compose logs'."
          EOF
